services:
  portfolio:
    build:
      context: .
      target: runtime
    image: ahmed-saber-portfolio:1.0.0
    container_name: ahmed-saber-portfolio
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
