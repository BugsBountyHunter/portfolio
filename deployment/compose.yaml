# Production service. Caddy owns ports 80 and 443 on the server and reaches this
# container over the shared `web` network. `compose.local.yaml` publishes a port for
# local runs. The project name matches the container already running on the server.
name: source

services:
  portfolio:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: runtime
    image: ${PORTFOLIO_IMAGE:-ahmed-saber-portfolio:1.0.0}
    container_name: ahmed-saber-portfolio
    platform: linux/amd64
    restart: unless-stopped
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M

networks:
  web:
    external: true
