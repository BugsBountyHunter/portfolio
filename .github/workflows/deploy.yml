name: Publish and deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Select immutable image name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "value=ghcr.io/${REPOSITORY,,}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.value }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  deploy:
    name: Deploy production
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload deployment definition
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" 'mkdir -p /home/saber/apps/ahmed-portfolio/source/deployment'
          scp deployment/compose.yaml "$SSH_USER@$SSH_HOST:/home/saber/apps/ahmed-portfolio/source/deployment/compose.yaml"
      - name: Pull and start immutable image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          if [[ ! "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "GHCR_USERNAME is invalid" >&2
            exit 1
          fi
          printf '%s' "$GHCR_READ_TOKEN" | ssh "$SSH_USER@$SSH_HOST" "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          ssh "$SSH_USER@$SSH_HOST" "cd /home/saber/apps/ahmed-portfolio/source && PORTFOLIO_IMAGE='$IMAGE' docker compose -f deployment/compose.yaml pull && PORTFOLIO_IMAGE='$IMAGE' docker compose -f deployment/compose.yaml up -d --no-build --remove-orphans"
      - name: Verify production health
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" 'attempt=1; while [ "$attempt" -le 20 ]; do if curl --fail --silent --show-error --connect-timeout 2 --max-time 5 http://127.0.0.1/healthz; then exit 0; fi; if [ "$attempt" -eq 20 ]; then docker logs --tail=100 ahmed-saber-portfolio; exit 1; fi; attempt=$((attempt + 1)); sleep 2; done'
