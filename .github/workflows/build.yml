name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps firefox
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: nextjs/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash deployment/tests/container-smoke.sh
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          workdir="$(mktemp -d)"
          curl --fail --silent --show-error --location --output "${workdir}/${archive}" "${base}/${archive}"
          curl --fail --silent --show-error --location --output "${workdir}/checksums.txt" "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          (cd "${workdir}" && grep " ${archive}\$" checksums.txt | sha256sum --check --strict)
          tar -xzf "${workdir}/${archive}" -C "${workdir}" trivy
          sudo install -m 755 "${workdir}/trivy" /usr/local/bin/trivy
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: "true"
          image-ref: ahmed-saber-portfolio:1.0.0
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
